<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TubeSaver — Download YouTube Videos & Audio</title>

    <link
        rel="icon"
        type="image/jpeg"
        href="/ytlogo.jpg"
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #0f0f11;
            color: #f0f0f5;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 640px;
        }

        h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: .25rem;

            background:
                linear-gradient(
                    135deg,
                    #ff3b5c,
                    #ff7e5f
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            text-align: center;
            color: #8888a0;
            margin-bottom: 2rem;
            font-size: .9rem;
        }

        .card {
            background: #1a1a1f;
            border: 1px solid #2a2a33;
            border-radius: 12px;
            padding: 1.5rem;
        }

        input {
            width: 100%;

            padding: .85rem 1rem;

            border: 1px solid #2a2a33;
            border-radius: 8px;

            background: #0f0f11;
            color: #fff;

            font-size: 1rem;

            outline: none;
        }

        input:focus {
            border-color: #ff3b5c;
        }

        input::placeholder {
            color: #555;
        }

        .toggle {
            display: flex;
            gap: .5rem;
            margin: 1rem 0;
        }

        .toggle button {
            flex: 1;

            padding: .65rem;

            border: 1px solid #2a2a33;
            border-radius: 8px;

            background: #0f0f11;
            color: #8888a0;

            font-size: .9rem;
            font-weight: 600;

            cursor: pointer;
        }

        .toggle button.active {
            border-color: #ff3b5c;
            color: #fff;
            background: rgba(255, 59, 92, .1);
        }

        #fetchBtn {
            width: 100%;

            padding: .85rem;

            border: none;
            border-radius: 8px;

            background: #ff3b5c;
            color: #fff;

            font-size: 1rem;
            font-weight: 600;

            cursor: pointer;

            margin-top: .5rem;
        }

        #fetchBtn:hover {
            background: #e03250;
        }

        #fetchBtn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 1rem;

            padding: .75rem 1rem;

            border-radius: 8px;

            font-size: .9rem;

            display: none;
        }

        #status.info {
            display: block;
            background: rgba(52, 152, 219, .15);
            color: #85c1e9;
        }

        #status.error {
            display: block;
            background: rgba(231, 76, 60, .15);
            color: #f1948a;
        }

        #status.success {
            display: block;
            background: rgba(46, 204, 113, .15);
            color: #82e0aa;
        }

        #result {
            display: none;

            margin-top: 1rem;
            padding: 1rem;

            background: #0f0f11;

            border-radius: 8px;
            border: 1px solid #2a2a33;

            text-align: center;
        }

        #result.show {
            display: block;
        }

        #result img {
            width: 100%;
            max-width: 320px;

            border-radius: 8px;

            margin-bottom: .75rem;

            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #result h3 {
            font-size: 1rem;
            margin-bottom: .25rem;
        }

        .channel {
            color: #8888a0;
            font-size: .85rem;
            margin-bottom: 1rem;
        }

        .dl-btn {
            display: inline-block;

            padding: .75rem 2rem;

            border: none;
            border-radius: 8px;

            background: #2ecc71;
            color: #fff;

            font-size: 1rem;
            font-weight: 600;

            cursor: pointer;
        }

        .dl-btn:hover {
            background: #27ae60;
        }

        .dl-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .progress {
            display: none;

            margin-top: 1rem;

            text-align: left;
        }

        .progress.show {
            display: block;

            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .progress-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;

            gap: .75rem;

            margin-bottom: .5rem;
        }

        #progressPhase {
            color: #8888a0;
            font-size: .85rem;
        }

        #progressPercent {
            color: #f0f0f5;

            font-size: .85rem;
            font-weight: 700;

            font-variant-numeric: tabular-nums;
        }

        .progress-track {
            height: 8px;

            background: #0f0f11;

            border: 1px solid #2a2a33;
            border-radius: 8px;

            overflow: hidden;
        }

        .progress-fill {
            position: relative;

            width: 0%;
            height: 100%;

            border-radius: 8px;

            background:
                linear-gradient(
                    135deg,
                    #ff3b5c,
                    #ff7e5f
                );

            transition: width .35s ease;
        }

        .progress-fill.active::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, .35),
                    transparent
                );

            transform: translateX(-100%);

            animation: sheen 1.4s ease-in-out infinite;
        }

        @keyframes sheen {
            to {
                transform: translateX(100%);
            }
        }

        .progress-fill.done {
            background: #2ecc71;
        }

        .progress-fill.error {
            background: #e74c3c;
        }

        .progress-meta {
            margin-top: .4rem;

            min-height: 1em;

            color: #555;

            font-size: .78rem;

            font-variant-numeric: tabular-nums;
        }

        footer {
            margin-top: 2rem;

            text-align: center;

            color: #555;

            font-size: .8rem;
        }

        .spinner {
            display: inline-block;

            width: 16px;
            height: 16px;

            border: 2px solid rgba(255,255,255,.3);
            border-top-color: #fff;

            border-radius: 50%;

            animation: spin .6s linear infinite;

            vertical-align: middle;

            margin-right: .4rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 TubeSaver</h1>

    <p class="sub">
        Download YouTube videos as MP4 or convert to MP3 audio
    </p>

    <div class="card">

        <input
            type="text"
            id="urlInput"
            placeholder="Paste YouTube URL here…"
            autocomplete="off"
            autofocus
        >

        <div class="toggle">

            <button
                id="btnVideo"
                class="active"
                type="button"
            >
                🎥 Video (MP4)
            </button>

            <button
                id="btnAudio"
                type="button"
            >
                🎵 Audio (MP3)
            </button>

        </div>

        <button
            id="fetchBtn"
            type="button"
        >
            Fetch Video Info
        </button>

        <div id="status"></div>

        <div id="result">

            <img
                id="thumb"
                src=""
                alt="YouTube thumbnail"
            >

            <h3 id="videoTitle">
                Title
            </h3>

            <p
                class="channel"
                id="videoChannel"
            >
                Channel
            </p>

            <button
                class="dl-btn"
                id="downloadBtn"
                type="button"
            >
                ⬇ Download Now
            </button>

            <div
                class="progress"
                id="progress"
            >

                <div class="progress-head">

                    <span id="progressPhase">
                        Preparing download…
                    </span>

                    <span id="progressPercent">
                        0%
                    </span>

                </div>

                <div
                    class="progress-track"
                    id="progressBar"
                    role="progressbar"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    aria-label="Download progress"
                >

                    <div
                        class="progress-fill"
                        id="progressFill"
                    ></div>

                </div>

                <div
                    class="progress-meta"
                    id="progressMeta"
                ></div>

            </div>

        </div>

    </div>

    <footer>
        For authorized use only. Respect copyright.
    </footer>

</div>

<script>
    const urlInput =
        document.getElementById("urlInput");

    const fetchBtn =
        document.getElementById("fetchBtn");

    const statusEl =
        document.getElementById("status");

    const resultEl =
        document.getElementById("result");

    const thumb =
        document.getElementById("thumb");

    const videoTitle =
        document.getElementById("videoTitle");

    const videoChannel =
        document.getElementById("videoChannel");

    const downloadBtn =
        document.getElementById("downloadBtn");

    const btnVideo =
        document.getElementById("btnVideo");

    const btnAudio =
        document.getElementById("btnAudio");

    const progressEl =
        document.getElementById("progress");

    const progressBar =
        document.getElementById("progressBar");

    const progressFill =
        document.getElementById("progressFill");

    const progressPhase =
        document.getElementById("progressPhase");

    const progressPercent =
        document.getElementById("progressPercent");

    const progressMeta =
        document.getElementById("progressMeta");


    let currentFormat = "video";

    let currentVideoId = null;

    let progressSource = null;


    // --------------------------------
    // Extract YouTube video ID
    // --------------------------------

    function extractId(url) {

        if (!url) {
            return null;
        }

        const match = url.match(
            /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/
        );

        return match ? match[1] : null;
    }


    // --------------------------------
    // Show status message
    // --------------------------------

    function showStatus(message, type) {

        statusEl.textContent = message;

        statusEl.className = "";

        statusEl.classList.add(type);
    }


    // --------------------------------
    // Progress bar
    // --------------------------------

    function setProgress({
        percent,
        phase,
        status,
        speed,
        eta,
        message
    }) {

        const value =
            Math.max(
                0,
                Math.min(100, Math.round(percent || 0))
            );

        progressEl.classList.add("show");

        progressBar.setAttribute(
            "aria-valuenow",
            String(value)
        );

        progressFill.style.width = value + "%";

        progressPercent.textContent = value + "%";

        if (phase) {
            progressPhase.textContent = phase;
        }

        const running =
            status === "starting" ||
            status === "waiting" ||
            status === "downloading" ||
            status === "postprocessing";

        progressFill.classList.toggle("active", running);
        progressFill.classList.toggle("done", status === "done");
        progressFill.classList.toggle("error", status === "error");

        const meta = [];

        if (speed && status === "downloading") {
            meta.push(speed);
        }

        if (
            eta &&
            eta !== "Unknown" &&
            status === "downloading"
        ) {
            meta.push("ETA " + eta);
        }

        if (message && status === "error") {
            meta.push(message);
        }

        progressMeta.textContent = meta.join("  ·  ");
    }


    function resetProgress() {

        progressFill.classList.remove(
            "active",
            "done",
            "error"
        );

        setProgress({
            percent: 0,
            phase: "Preparing download…",
            status: "starting"
        });
    }


    function closeProgressSource() {

        if (progressSource) {
            progressSource.close();
            progressSource = null;
        }
    }


    // --------------------------------
    // Video button
    // --------------------------------

    btnVideo.addEventListener("click", () => {

        currentFormat = "video";

        btnVideo.classList.add("active");

        btnAudio.classList.remove("active");

    });


    // --------------------------------
    // Audio button
    // --------------------------------

    btnAudio.addEventListener("click", () => {

        currentFormat = "audio";

        btnAudio.classList.add("active");

        btnVideo.classList.remove("active");

    });


    // --------------------------------
    // Fetch video information
    // --------------------------------

    async function handleFetch() {

        const url =
            urlInput.value.trim();

        const id =
            extractId(url);


        if (!id) {

            showStatus(
                "Enter a valid YouTube URL.",
                "error"
            );

            resultEl.classList.remove("show");

            return;
        }


        fetchBtn.disabled = true;

        fetchBtn.innerHTML =
            '<span class="spinner"></span> Fetching…';


        showStatus(
            "Getting video information…",
            "info"
        );


        resultEl.classList.add("show");


        // Temporary thumbnail while loading

        thumb.src =
            `https://img.youtube.com/vi/${id}/mqdefault.jpg`;


        videoTitle.textContent =
            "Loading...";


        videoChannel.textContent =
            "...";


        currentVideoId = id;


        try {

            const response =
                await fetch(
                    `/api/getVideoInfo?id=${encodeURIComponent(id)}`
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Request failed"
                );

            }


            // --------------------------------
            // Set title
            // --------------------------------

            videoTitle.textContent =
                data.title ||
                "YouTube Video" ||
                "Video";


            // --------------------------------
            // Set channel
            // --------------------------------

            videoChannel.textContent =
                data.author ||
                "YouTube" ||
                "Channel";


            // --------------------------------
            // Set thumbnail
            // --------------------------------

            if (data.thumbnail) {

                thumb.src =
                    data.thumbnail;

            }


            // --------------------------------
            // Thumbnail fallback
            // --------------------------------

            thumb.onerror = () => {

                thumb.onerror = null;

                thumb.src =
                    `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

            };


            showStatus(
                "Video information loaded.",
                "success"
            );


        } catch (error) {

            console.error(
                "Fetch error:",
                error
            );


            videoTitle.textContent =
                "YouTube Video";


            videoChannel.textContent =
                "YouTube";


            showStatus(
                error.message ||
                "Unable to retrieve video information.",
                "error"
            );

        }


        fetchBtn.disabled = false;

        fetchBtn.textContent =
            "Fetch Video Info";
    }


    // --------------------------------
    // Download button
    // --------------------------------

    downloadBtn.addEventListener(
        "click",
        async () => {

            if (!currentVideoId) {

                showStatus(
                    "Fetch a video first.",
                    "error"
                );

                return;
            }


            const endpoint =
                currentFormat === "audio"
                    ? "/api/download/audio"
                    : "/api/download/video";


            // Id shared by the progress stream and the download
            // request so the server can pair the two together.

            const jobId =
                (
                    (window.crypto &&
                        crypto.randomUUID &&
                        crypto.randomUUID()) ||
                    `${Date.now()}${Math.random()
                        .toString(16)
                        .slice(2)}`
                ).replace(/-/g, "");


            downloadBtn.disabled = true;

            downloadBtn.textContent =
                "⏳ Preparing...";


            showStatus(
                "Preparing your download...",
                "info"
            );


            closeProgressSource();

            resetProgress();


            // --------------------------------
            // Live progress stream
            // --------------------------------

            progressSource =
                new EventSource(
                    `/api/progress?job=${encodeURIComponent(jobId)}`
                );


            progressSource.onmessage = event => {

                let data;

                try {
                    data = JSON.parse(event.data);
                } catch (_) {
                    return;
                }


                setProgress(data);


                if (
                    data.status === "done" ||
                    data.status === "error"
                ) {
                    closeProgressSource();
                }
            };


            progressSource.onerror = () => {
                // The server ends the stream once the job is
                // finished; stop EventSource from reconnecting.
                closeProgressSource();
            };


            try {

                const response =
                    await fetch(
                        `${endpoint}?id=${encodeURIComponent(currentVideoId)}&job=${encodeURIComponent(jobId)}`
                    );


                const contentType =
                    response.headers.get(
                        "content-type"
                    ) || "";


                // --------------------------------
                // If server returns JSON error
                // --------------------------------

                if (
                    contentType.includes(
                        "application/json"
                    )
                ) {

                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            data.error ||
                            "Download unavailable."
                        );

                    }


                    showStatus(
                        data.message ||
                        "Download is ready.",
                        "success"
                    );

                    return;
                }


                // --------------------------------
                // If server returns a file
                // --------------------------------

                if (!response.ok) {

                    throw new Error(
                        "Download request failed."
                    );

                }


                setProgress({
                    percent: 100,
                    phase: "Saving file…",
                    status: "postprocessing"
                });


                const blob =
                    await response.blob();


                const downloadUrl =
                    window.URL.createObjectURL(blob);


                const link =
                    document.createElement("a");


                link.href =
                    downloadUrl;


                link.download =
                    currentFormat === "audio"
                        ? "TubeSaver-audio.mp3"
                        : "TubeSaver-video.mp4";


                document.body.appendChild(link);

                link.click();

                link.remove();


                window.URL.revokeObjectURL(
                    downloadUrl
                );


                setProgress({
                    percent: 100,
                    phase: "Download complete",
                    status: "done"
                });


                showStatus(
                    "Download started.",
                    "success"
                );


                setTimeout(
                    () =>
                        progressEl.classList.remove(
                            "show"
                        ),
                    2500
                );


            } catch (error) {

                console.error(
                    "Download error:",
                    error
                );


                setProgress({
                    percent: 0,
                    phase: "Download failed",
                    status: "error",
                    message:
                        error.message ||
                        "Download unavailable."
                });


                showStatus(
                    error.message ||
                    "Download unavailable.",
                    "error"
                );

            } finally {

                closeProgressSource();

                downloadBtn.disabled =
                    false;

                downloadBtn.textContent =
                    "⬇ Download Now";
            }

        }
    );


    // --------------------------------
    // Fetch button
    // --------------------------------

    fetchBtn.addEventListener(
        "click",
        handleFetch
    );


    // --------------------------------
    // Enter key
    // --------------------------------

    urlInput.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {

                handleFetch();

            }

        }
    );

</script>

</body>
</html>
