<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TubeSaver — Download YouTube Videos & Audio</title><link rel="icon" type="image/jpeg" href="/ytlogo.jpg">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f11;
        color: #f0f0f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
    }

    .container {
        width: 100%;
        max-width: 640px;
    }

    h1 {
        text-align: center;
        font-size: 1.8rem;
        margin-bottom: .25rem;
        background: linear-gradient(135deg, #ff3b5c, #ff7e5f);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .sub {
        text-align: center;
        color: #8888a0;
        margin-bottom: 2rem;
        font-size: .9rem;
    }

    .card {
        background: #1a1a1f;
        border: 1px solid #2a2a33;
        border-radius: 12px;
        padding: 1.5rem;
    }

    input {
        width: 100%;
        padding: .85rem 1rem;
        border: 1px solid #2a2a33;
        border-radius: 8px;
        background: #0f0f11;
        color: #fff;
        font-size: 1rem;
        outline: none;
    }

    input:focus {
        border-color: #ff3b5c;
    }

    input::placeholder {
        color: #555;
    }

    .toggle {
        display: flex;
        gap: .5rem;
        margin: 1rem 0;
    }

    .toggle button {
        flex: 1;
        padding: .65rem;
        border: 1px solid #2a2a33;
        border-radius: 8px;
        background: #0f0f11;
        color: #8888a0;
        font-size: .9rem;
        font-weight: 600;
        cursor: pointer;
    }

    .toggle button.active {
        border-color: #ff3b5c;
        color: #fff;
        background: rgba(255, 59, 92, .1);
    }

    #fetchBtn {
        width: 100%;
        padding: .85rem;
        border: none;
        border-radius: 8px;
        background: #ff3b5c;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        margin-top: .5rem;
    }

    #fetchBtn:hover {
        background: #e03250;
    }

    #fetchBtn:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    #status {
        margin-top: 1rem;
        padding: .75rem 1rem;
        border-radius: 8px;
        font-size: .9rem;
        display: none;
    }

    #status.info {
        display: block;
        background: rgba(52, 152, 219, .15);
        color: #85c1e9;
    }

    #status.error {
        display: block;
        background: rgba(231, 76, 60, .15);
        color: #f1948a;
    }

    #status.success {
        display: block;
        background: rgba(46, 204, 113, .15);
        color: #82e0aa;
    }

    #result {
        display: none;
        margin-top: 1rem;
        padding: 1rem;
        background: #0f0f11;
        border-radius: 8px;
        border: 1px solid #2a2a33;
        text-align: center;
    }

    #result.show {
        display: block;
    }

    #result img {
        width: 100%;
        max-width: 320px;
        border-radius: 8px;
        margin-bottom: .75rem;
    }

    #result h3 {
        font-size: 1rem;
        margin-bottom: .25rem;
    }

    .channel {
        color: #8888a0;
        font-size: .85rem;
        margin-bottom: 1rem;
    }

    .dl-btn {
        display: inline-block;
        padding: .75rem 2rem;
        border: none;
        border-radius: 8px;
        background: #2ecc71;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
    }

    .dl-btn:hover {
        background: #27ae60;
    }

    .dl-btn:disabled {
        opacity: .5;
        cursor: not-allowed;
    }

    footer {
        margin-top: 2rem;
        text-align: center;
        color: #555;
        font-size: .8rem;
    }.spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255,255,255,.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .6s linear infinite;
        vertical-align: middle;
        margin-right: .4rem;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>

</head><body><div class="container"><h1>🎬 TubeSaver</h1>

<p class="sub">
    Download YouTube videos as MP4 or convert to MP3 audio
</p>

<div class="card">

    <input
        type="text"
        id="urlInput"
        placeholder="Paste YouTube URL here…"
        autocomplete="off"
        autofocus
    >

    <div class="toggle">

        <button id="btnVideo" class="active">
            🎥 Video (MP4)
        </button>

        <button id="btnAudio">
            🎵 Audio (MP3)
        </button>

    </div>

    <button id="fetchBtn">
        Fetch Video Info
    </button>

    <div id="status"></div>

    <div id="result">

        <img
            id="thumb"
            src=""
            alt="YouTube thumbnail"
        >

        <h3 id="videoTitle">
            Title
        </h3>

        <p
            class="channel"
            id="videoChannel"
        >
            Channel
        </p>

        <button
            class="dl-btn"
            id="downloadBtn"
        >
            ⬇ Download Now
        </button>

    </div>

</div>

<footer>
    For authorized use only. Respect copyright.
</footer>

</div><script>

const urlInput = document.getElementById("urlInput");
const fetchBtn = document.getElementById("fetchBtn");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const thumb = document.getElementById("thumb");
const videoTitle = document.getElementById("videoTitle");
const videoChannel = document.getElementById("videoChannel");
const downloadBtn = document.getElementById("downloadBtn");
const btnVideo = document.getElementById("btnVideo");
const btnAudio = document.getElementById("btnAudio");

let currentFormat = "video";
let currentVideoId = null;

function extractId(url) {

    if (!url) return null;

    const match = url.match(
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([A-Za-z0-9_-]{11})/
    );

    return match ? match[1] : null;
}

function showStatus(message, type) {

    statusEl.textContent = message;
    statusEl.className = "";
    statusEl.id = "status";
    statusEl.classList.add(type);
}

btnVideo.addEventListener("click", () => {

    currentFormat = "video";

    btnVideo.classList.add("active");
    btnAudio.classList.remove("active");

});

btnAudio.addEventListener("click", () => {

    currentFormat = "audio";

    btnAudio.classList.add("active");
    btnVideo.classList.remove("active");

});

async function handleFetch() {

    const url = urlInput.value.trim();
    const id = extractId(url);

    if (!id) {

        showStatus(
            "Enter a valid YouTube URL.",
            "error"
        );

        return;
    }

    fetchBtn.disabled = true;

    fetchBtn.innerHTML =
        '<span class="spinner"></span> Fetching…';

    showStatus(
        "Getting video information…",
        "info"
    );

    resultEl.classList.add("show");

    thumb.src =
        https://img.youtube.com/vi/${id}/mqdefault.jpg;

    videoTitle.textContent = "Loading...";
    videoChannel.textContent = "...";

    currentVideoId = id;

    try {

        const response = await fetch(
            /api/getVideoInfo?id=${encodeURIComponent(id)}
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error || "Request failed"
            );
        }

        videoTitle.textContent =
            data.title || "YouTube Video";

        videoChannel.textContent =
            data.author || "YouTube";

        showStatus(
            "Video information loaded.",
            "success"
        );} catch (error) {

videoTitle.textContent =
    "YouTube Video";

videoChannel.textContent =
    "YouTube";

showStatus(
    "Unable to retrieve video information.",
    "error"
);
}

fetchBtn.disabled = false;

fetchBtn.textContent =
"Fetch Video Info";
}

downloadBtn.addEventListener(
"click",
async () => {

if (!currentVideoId) return;

const endpoint =
    currentFormat === "audio"
        ? "/api/download/audio"
        : "/api/download/video";

downloadBtn.disabled = true;

downloadBtn.textContent =
    "⏳ Preparing...";

showStatus(
    "Preparing your download...",
    "info"
);

try {

    const response = await fetch(
        ${endpoint}?id=${encodeURIComponent(currentVideoId)}
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(
            data.message ||
            data.error ||
            "Download unavailable."
        );
    }

} catch (error) {

    showStatus(
        error.message,
        "error"
    );
}

downloadBtn.disabled = false;

downloadBtn.textContent =
    "⬇ Download Now";
}
);

fetchBtn.addEventListener(
"click",
handleFetch
);

urlInput.addEventListener(
"keydown",
event => {

if (event.key === "Enter") {
    handleFetch();
}

}
);

</script></body>
</html>
